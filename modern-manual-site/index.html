<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suzuki Manual Viewer - v2.0</title>
    <link rel="stylesheet" href="./styles.css?v=23" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1>Suzuki Manual Viewer - v2.0</h1>
          <p>Modern Suzuki Manual Viewer</p>
        </div>
        <div class="topbar-actions">
          <label class="field">
            <span>Model</span>
            <select id="datasetSelect"></select>
          </label>
          <label id="submodelField" class="field" hidden>
            <span>Code</span>
            <select id="submodelSelect"></select>
          </label>
          <label id="modelField" class="field" hidden>
            <span>Engine Code</span>
            <select id="modelSelect"></select>
          </label>
          <button id="themeToggle" class="button secondary" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
            <span class="theme-icon" aria-hidden="true">&#9788;</span>
          </button>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="sidebar-header-row">
              <h2>Manual Pages</h2>
              <button id="sidebarToggle" class="button secondary sidebar-toggle" type="button" aria-expanded="true" aria-controls="tree" aria-label="Collapse Manual Pages" title="Collapse Manual Pages">
                <<
              </button>
            </div>
            <div id="treeTabs" class="tree-tabs" role="tablist" aria-label="Tree categories"></div>
            <input id="treeFilter" type="search" placeholder="Filter..." />
          </div>
          <nav id="tree" class="tree" aria-label="Manual file tree"></nav>
        </aside>

        <div
          id="sidebarResizer"
          class="sidebar-resizer"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize Manual Pages pane"
        ></div>

        <section class="content">
          <article id="viewer" class="viewer empty">
            <h2>Select a file from the tree</h2>
            <p>The selected XML file will render here as a modern document view.</p>
          </article>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js?v=27"></script>
  </body>
</html>
