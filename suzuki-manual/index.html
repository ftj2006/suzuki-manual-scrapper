<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Local Suzuki Manual</title>
    <style>
      :root { color-scheme: light; }
      html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f3f3f3; }
      body { display: grid; grid-template-rows: 56px 56px 1fr; }
      iframe { border: 0; display: block; width: 100%; background: white; }
      .ctl { height: 56px; }
      .top { height: 56px; border-bottom: 1px solid #d0d0d0; }
      .content { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 0; }
      .nav { min-width: 320px; height: 100%; border-right: 1px solid #d0d0d0; }
      .main { min-width: 0; height: 100%; }
      @media (max-width: 960px) {
        .content { grid-template-columns: 1fr; }
        .nav { max-height: 35vh; border-right: 0; border-bottom: 1px solid #d0d0d0; }
      }
    </style>
        <script>
            (function () {
                if (window.init && typeof window.init.join === 'function') {
                    return;
                }
                window.init = {
                    childwindows: [],
                    join: function (win, fn) {
                        this.childwindows.push(win);
                        if (typeof fn === 'function') {
                            window.setTimeout(function () {
                                try {
                                    fn();
                                } catch (error) {
                                    console.error(error);
                                }
                            }, 0);
                        }
                    }
                };
            })();
        </script>
  </head>
  <body>
    <iframe class="ctl" name="CTL" src="dcs.suzukiauto.co.za/Upload/Downloads/Service/ServiceManuals/SWIFT_A2L310_A2L412_A2L414/xml/AENLSB0A/navi/ctl.html"></iframe>
    <iframe class="top" name="TOP" src="dcs.suzukiauto.co.za/Upload/Downloads/Service/ServiceManuals/SWIFT_A2L310_A2L412_A2L414/xml/AENLSB0A/navi/top.html"></iframe>
    <div class="content">
      <iframe class="nav" name="NAVI" src="dcs.suzukiauto.co.za/Upload/Downloads/Service/ServiceManuals/SWIFT_A2L310_A2L412_A2L414/xml/AENLSB0A/navi/navi.html"></iframe>
      <iframe class="main" name="MAIN" src="dcs.suzukiauto.co.za/Upload/Downloads/Service/ServiceManuals/SWIFT_A2L310_A2L412_A2L414/xml/AENLSB0A/navi/main.html"></iframe>
    </div>
  </body>
</html>
