  <head>
    <meta charset="utf-8" />

    <title>Local Suzuki Manual - v1.8</title>
    <style>
      :root { color-scheme: light; }
      html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f3f3f3; }
      body { display: grid; grid-template-rows: auto auto 1fr; }
      iframe { border: 0; display: block; width: 100%; background: white; }
      .ctl { display: none; }
      .top { display: none; }
      /* Keep header rows flexible; content should occupy the remaining 1fr row */
      body { min-height: 100vh; }
      .content { display: flex; flex-direction: row; min-height: 0; height: 100%; grid-row: 3; }
      /* Child iframes stretch to fill the .content height */
      .content iframe { border: 0; display: block; width: 100%; height: 100%; }
      .nav { flex: 0 0 320px; min-width: 320px; height: 100%; border-right: 1px solid #d0d0d0; min-height: 0; }
      .main { flex: 1 1 auto; min-width: 0; height: 100%; }
      @media (max-width: 960px) {
        .content { grid-template-columns: 1fr; }
        .nav { max-height: 35vh; border-right: 0; border-bottom: 1px solid #d0d0d0; }
      }
    </style>
        <script>
            (function () {
                if (window.init && typeof window.init.join === 'function') {
                    return;
                }
                window.init = {
                    childwindows: [],
                    join: function (win, fn) {
                        this.childwindows.push(win);
                        if (typeof fn === 'function') {
                            window.setTimeout(function () {
                                try {
                                    fn();
                                } catch (error) {
                                    console.error(error);
                                }
                            }, 0);
                        }
                    }
                };
            })();
        </script>
  </head>

    <div class="content">
