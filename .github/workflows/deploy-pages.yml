name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_branch:
        description: 'Branch to publish from (leave empty to use the branch that triggered this run)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish_branch || github.ref_name }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stage site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Some mirrored legacy pages reference shared assets via */xml/{config8,icon,image,symbol}.
          # Materialize these paths in the staged site when possible, but never fail if a source is absent.
          if [ -d "modern-manual-site/source-mirror" ]; then
            while IFS= read -r -d '' xml_dir; do
              for shared in config8 icon image symbol; do
                src="modern-manual-site/source-mirror/_shared-common/$shared"
                dst="$xml_dir/$shared"
                if [ -e "$src" ] && [ ! -e "$dst" ]; then
                  mkdir -p "$(dirname "$dst")"
                  cp -RL "$src" "$dst"
                fi
              done
            done < <(find modern-manual-site/source-mirror -mindepth 2 -maxdepth 2 -type d -name xml -print0)
          fi

          # Use -L for individual shared assets, but preserve symlinks for large mirrored trees
          # to avoid hard failures on broken legacy links during staging.
          for path in index.html 404.html .nojekyll config8 icon image symbol suzuki-manual modern-manual-site manuals-index working-urls.html working-urls-grouped-report.html whatsapp-working-urls.html; do
            if [ -e "$path" ]; then
              if [ "$path" = "modern-manual-site" ] || [ "$path" = "suzuki-manual" ]; then
                cp -R "$path" _site/
              else
                cp -RL "$path" _site/
              fi
            fi
          done
          python3 .github/scripts/inject_base_tags.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5