name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_branch:
        description: 'Branch to publish from (leave empty to use the branch that triggered this run)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish_branch || github.ref_name }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stage site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Publish the modern viewer at repository root.
          # Keep the legacy frame-based suzuki-manual app excluded.
          if [ -d modern-manual-site ]; then
            cp -R modern-manual-site/. _site/
          fi

          # Keep supplemental top-level routes/files that are still needed.
          for path in 404.html .nojekyll manuals-index; do
            if [ -e "$path" ]; then
              cp -R "$path" _site/
            fi
          done

          # Some IMPORTANT/FOREWORD assets are missing in modern source-mirror but
          # still exist in legacy ServiceManuals XML trees. Backfill Foreword images only.
          legacy_xml_root="suzuki-manual/dcs.suzukiauto.co.za/Upload/Downloads/Service/ServiceManuals"
            if [ -d "$legacy_xml_root" ] && [ -d "_site/source-mirror" ]; then
              while IFS= read -r -d '' src; do
                rel="${src#$legacy_xml_root/}"
                dest="_site/source-mirror/$rel"
                parent_dir="$(dirname "$dest")"
                if [ ! -e "$dest" ]; then
                  if [ -e "$parent_dir" ] && [ ! -d "$parent_dir" ]; then
                    continue
                  fi
                  mkdir -p "$parent_dir"
                  cp "$src" "$dest"
                fi
              done < <(
                find "$legacy_xml_root" -type f \
                  \( -path '*/Foreword*/*' \) \
                  \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.svg' \) \
                  -print0
              )
          fi

          # Shared assets may be symlinks in the repo. Materialize them as real files in _site.
          for path in image symbol icon config8; do
            if [ -e "$path" ]; then
              cp -RL "$path" _site/
            fi
          done

          # Remove accidental recursive mirror residue that can break artifact packing.
          rm -rf _site/modern-manual-site/source-mirror/_shared-common/suzuki-manual-scrapper || true

          # Artifact upload is strict about symlinks; remove any that remain in staged output.
          find _site -type l -print -delete || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5