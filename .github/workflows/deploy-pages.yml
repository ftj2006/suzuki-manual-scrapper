name: Deploy GitHub Pages

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      publish_branch:
        description: Branch to publish from
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_branch }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # Use -L so symlinks (config8/icon/image/symbol) are copied as real directories/files.
          for path in index.html 404.html .nojekyll config8 icon image symbol suzuki-manual working-urls.html working-urls-grouped-report.html whatsapp-working-urls.html; do
            if [ -e "$path" ]; then
              cp -RL "$path" _site/
            fi
          done
            python3 -c "exec('''from pathlib import Path\nimport re\n\nbase_script = \"<script type=\\\"text/javascript\\\">document.write('<base href=\\\"' + new URL('./', window.location.href).href + '\\\" />');</script>\"\n\nfor html_path in Path('_site').rglob('*.html'):\n    text = html_path.read_text(encoding='utf-8')\n    if \"new URL('./', window.location.href)\" in text or \"<base href=\" in text:\n        continue\n    updated_text, replacements = re.subn(r'<head([^>]*)>', r'<head\\1>' + base_script, text, count=1, flags=re.IGNORECASE)\n    if replacements:\n        html_path.write_text(updated_text, encoding='utf-8')\n''')"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4