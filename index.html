<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suzuki Manual Hub</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search || "");
        var go = (params.get("go") || "").toLowerCase();

        if (go === "manual") {
          window.location.replace("./suzuki-manual/index.html");
          return;
        }

        if (go === "index") {
          window.location.replace("./manuals-index/index.html");
        }
      })();
    </script>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #1f1f1f;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        width: min(560px, 100%);
        background: white;
        border: 1px solid #d8d8d8;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.6rem;
      }
      p {
        margin: 0 0 14px;
        line-height: 1.5;
      }
      .actions {
        display: grid;
        gap: 10px;
        margin-top: 8px;
      }
      .actions a {
        display: block;
        text-decoration: none;
        color: #0f4c81;
        border: 1px solid #b8c7d4;
        background: #f8fbff;
        padding: 12px 14px;
        border-radius: 10px;
        font-weight: 700;
      }
      .actions a:hover {
        background: #eef5ff;
      }
      .actions small {
        display: block;
        margin-top: 4px;
        font-weight: 400;
        color: #4a5560;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Suzuki Manual Hub</h1>
        <p>Select where to start from the repository base.</p>
        <p>Optional shortcuts: <strong>?go=manual</strong> or <strong>?go=index</strong>.</p>
        <div class="actions">
          <a href="./suzuki-manual/index.html">
            Open Manual Viewer
            <small>Frame-based mirrored workshop manual</small>
          </a>
          <a href="./manuals-index/index.html">
            Open Manuals Index
            <small>Available Suzuki manuals</small>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
