<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suzuki Manual Hub</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search || "");
        var go = (params.get("go") || "").toLowerCase();

        if (!go) {
          window.location.replace("./modern-manual-site/index.html");
          return;
        }

        if (go === "modern") {
          window.location.replace("./modern-manual-site/index.html");
          return;
        }

        if (go === "index") {
          window.location.replace("./manuals-index/index.html");
        }
      })();

      function applyTheme(theme) {
        document.body.setAttribute("data-theme", theme);
      }

      function setupAutoTheme() {
        if (!window.matchMedia) {
          applyTheme("dark");
          return;
        }

        var media = window.matchMedia("(prefers-color-scheme: dark)");
        var syncTheme = function () {
          applyTheme(media.matches ? "dark" : "light");
        };

        syncTheme();

        if (typeof media.addEventListener === "function") {
          media.addEventListener("change", syncTheme);
        } else if (typeof media.addListener === "function") {
          media.addListener(syncTheme);
        }
      }
    </script>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --ink: #1a263b;
        --muted: #5f6f88;
        --line: #cfdbf0;
        --accent: #2b6fdb;
        --accent-soft: #e1ecff;
        --action-ink: #1f5fbe;
        --action-border: #bfd2f6;
        --action-bg: #eef4ff;
        --action-bg-hover: #e3eeff;
        --action-border-hover: #9fbcf1;
        --shadow: 0 18px 44px rgba(18, 40, 72, 0.08);
      }

      body[data-theme="dark"] {
        --bg: #0d1422;
        --card: #162235;
        --ink: #dce8ff;
        --muted: #9eb3d6;
        --line: #304764;
        --accent: #72b7ff;
        --accent-soft: #1d3553;
        --action-ink: #99cbff;
        --action-border: #3f5e8a;
        --action-bg: #1d2f4a;
        --action-bg-hover: #253a5d;
        --action-border-hover: #5d89c2;
        --shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top right, var(--accent-soft) 0%, var(--bg) 42%);
        color: var(--ink);
      }

      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(560px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 26px;
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.9rem;
        letter-spacing: 0.02em;
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 2px;
      }

      .s-logo {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: linear-gradient(135deg, color-mix(in oklab, var(--accent-soft) 62%, var(--card) 38%) 0%, var(--card) 100%);
        display: grid;
        place-items: center;
        color: var(--accent);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }

      .s-logo svg {
        width: 24px;
        height: 24px;
        display: block;
      }

      p {
        margin: 0 0 10px;
        line-height: 1.5;
        color: var(--muted);
      }

      .hint {
        margin-top: 2px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px dashed var(--line);
        background: linear-gradient(90deg, var(--accent-soft), transparent);
        color: var(--ink);
      }

      .actions {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      .actions a {
        display: block;
        text-decoration: none;
        color: var(--action-ink);
        border: 1px solid var(--action-border);
        background: var(--action-bg);
        padding: 12px 14px;
        border-radius: 8px;
        font-weight: 700;
      }

      .actions a:hover {
        background: var(--action-bg-hover);
        border-color: var(--action-border-hover);
      }

      .actions small {
        display: block;
        margin-top: 4px;
        font-weight: 400;
        color: var(--muted);
      }

      @media (max-width: 760px) {
        main {
          padding: 14px;
        }

        .card {
          padding: 18px;
        }

        h1 {
          font-size: 1.55rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="brand-row">
          <div class="s-logo" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img" focusable="false">
              <path
                fill="currentColor"
                d="M18 10h28a6 6 0 0 1 6 6v8h-8v-4a2 2 0 0 0-2-2H22a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h20a10 10 0 0 1 10 10v10a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6v-8h8v4a2 2 0 0 0 2 2h20a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H22a10 10 0 0 1-10-10V16a6 6 0 0 1 6-6z"
              />
            </svg>
          </div>
          <h1>Suzuki Manual Hub</h1>
        </div>
        <p>Select where to start from the repository base.</p>
        <div class="actions">
          <a href="./modern-manual-site/index.html">
            Open Modern Manual Viewer
            <small>New baseline experience with improved rendering and navigation</small>
          </a>
          <a href="./manuals-index/index.html">
            Open Manuals Index
            <small>Available Suzuki manuals</small>
          </a>
        </div>
      </div>
    </main>
    <script>
      setupAutoTheme();
    </script>
  </body>
</html>
